# Valeurs par défaut du chart sspcloud-mcp (Onyxia SSPCloud, self-hosted par-user).
# Le serveur MCP est stateless (sessions in-memory) : pas de PVC.
# Aucun secret n'est commité ici ; le bearer naît dans le namespace du user.
#
# L'image est tirée de GitHub Container Registry. Onyxia (catalogue) et install.sh
# déploient cette image telle quelle : pas de pip au démarrage du pod.

# --- Image ---------------------------------------------------------------------
image:
  repository: ghcr.io/nic01asfr/sspcloud-mcp
  tag: latest
  pullPolicy: Always

# Noms de ressources. fullnameOverride force le nom exact des ressources
# (Deployment/Service/Ingress/Secret). L'install CLI y met « mcp » pour l'URL
# user-<idep>-mcp. Vide = <release>-sspcloud-mcp (voie catalogue).
nameOverride: ""
fullnameOverride: ""

# --- Identité Onyxia -----------------------------------------------------------
onyxia:
  friendlyName: "SSPCloud MCP — Agent Compute"

# ONYXIA_USER est renseigné automatiquement par Onyxia (values.schema.json).
onyxia_user: ""

# --- Serveur MCP ---------------------------------------------------------------
app:
  # Hostname public (surchargé par Onyxia, cf. values.schema.json).
  host: ""
  port: 8000

# --- Garde Bearer du pod (auto-générée) ----------------------------------------
# Passée en value par Onyxia ({{service.oneTimePassword}}) ou par install.sh,
# pour que les NOTES affichent la clé. Vide → tirage dans le Secret, stable
# entre upgrades (helper lookup).
appAuth:
  token: ""

# --- RBAC (piloter les pods de travail + lire les tokens Jupyter) --------------
# ServiceAccount dédié + RoleBinding vers la ClusterRole 'edit' (existante).
# Lancé depuis le catalogue, Onyxia crée ce binding. En CLI, un pod utilisateur
# ne peut pas créer de RoleBinding : install.sh met rbac.create=false et
# réutilise le ServiceAccount du pod courant.
rbac:
  create: true
  clusterRole: edit

serviceAccount:
  name: ""

# --- Sécurité pod --------------------------------------------------------------
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# --- Ressources ----------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

# --- Répliques (sessions in-memory : garder 1) ---------------------------------
replicaCount: 1

# Pause Onyxia : 0 réplique. Le bouton « Suspendre » de Mes services.
global:
  suspend: false

# --- Service -------------------------------------------------------------------
service:
  type: ClusterIP
  port: 8000

# --- Ingress (classe onyxia = TLS auto via le wildcard *.user.lab.sspcloud.fr) -
ingress:
  enabled: true
  className: onyxia
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"

# --- Probes (/health est public, pas de Bearer) --------------------------------
probes:
  readiness:
    enabled: true
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  liveness:
    enabled: true
    path: /health
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
