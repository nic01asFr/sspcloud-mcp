icon: https://raw.githubusercontent.com/InseeFrLab/onyxia/main/web/public/favicon.svg
keywords:
  - mcp
  - sspcloud
  - onyxia
  - agent
  - compute
home: https://gitlab.cerema.fr/mcp/sspcloud_mcp
maintainers:
  - name: CEREMA
