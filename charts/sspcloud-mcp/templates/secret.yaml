apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sspcloud-mcp.fullname" . }}
  labels:
    {{- include "sspcloud-mcp.labels" . | nindent 4 }}
  annotations:
    # keep : le bearer survit aux upgrades / uninstall (souveraineté user, et la
    # config du client MCP reste valable).
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Garde Bearer du pod (auto-générée, stable via lookup).
  PASSERELLE_MCP_BEARER: {{ include "sspcloud-mcp.bearer" . | b64enc | quote }}
